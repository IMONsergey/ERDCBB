name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: krdv-guidelines-prototype/package-lock.json

      - name: Install dependencies
        working-directory: krdv-guidelines-prototype
        run: npm ci

      - name: Production build, lint and unit tests
        working-directory: krdv-guidelines-prototype
        env:
          GITHUB_PAGES: "true"
        run: npm run check

      - name: Install Chromium, Firefox and WebKit
        working-directory: krdv-guidelines-prototype
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser QA before release
        working-directory: krdv-guidelines-prototype
        run: npm run test:e2e -- --workers=2 --reporter=line

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: krdv-guidelines-prototype/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
