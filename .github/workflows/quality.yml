name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, content and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: krdv-guidelines-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: krdv-guidelines-prototype/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, build and unit tests
        run: npm run check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: npm run test:e2e -- --workers=2 --reporter=line
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erdcbb-playwright-failure
          path: |
            krdv-guidelines-prototype/test-results/
            krdv-guidelines-prototype/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
